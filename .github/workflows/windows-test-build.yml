# A Windows test build of this fork's AutoCAD-parity work: every push to the windows-build
# branch builds cadcraft.exe (x64, release, no signing) and puts it on this fork's test-build
# pre-release, replacing the build that was there. Not part of the pull requests.
name: Windows test build

on:
  push:
    branches: [windows-build]

permissions:
  contents: write

env:
  # The pre-release the build replaces.
  TAG: test-build-20261025-2124

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 120
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: 0
      # The C runtime linked in: the exe runs without the Visual C++ redistributable.
      RUSTFLAGS: -C target-feature=+crt-static
    steps:
      - uses: actions/checkout@v4
      - name: Check out craft-fonts
        uses: actions/checkout@v4
        with:
          repository: storytold/craft-fonts
          ref: b076417b5880bd4154bd22f00695b1d28c6bea83
          path: craft-fonts
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
      - name: Build
        shell: pwsh
        env:
          CRAFT_FONTS_DIR: ${{ github.workspace }}/craft-fonts
        run: cargo build --release --locked -p cadcraft --target x86_64-pc-windows-msvc
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out | Out-Null
          Copy-Item target/x86_64-pc-windows-msvc/release/cadcraft.exe out/cadcraft.exe
          Compress-Archive -Path out/cadcraft.exe -DestinationPath "out/cadcraft-$env:TAG-windows-x64.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: cadcraft-windows-x64
          path: out/*.zip
      - name: Replace the pre-release's build
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The tag moves to this commit; the files are replaced (same names); the notes say what it is.
          git tag -f "$TAG" "$GITHUB_SHA"
          git push -f origin "refs/tags/$TAG"
          gh release upload "$TAG" out/*.zip out/cadcraft.exe --repo "$GITHUB_REPOSITORY" --clobber
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --prerelease \
            --title "CADCraft Windows test build $TAG" \
            --notes "Unsigned Windows x64 test build (commit $GITHUB_SHA, built $(date -u +%Y-%m-%d)): all 15 parts of the AutoCAD-parity work (PRs #2316-#2330) with the FredApps and CodeRabbit review fixes, merged with current upstream main, with spline fit-point grip editing and the latest FredApps fixes. Windows SmartScreen will warn: More info > Run anyway."
